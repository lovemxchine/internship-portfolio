media:
  input: src/assets
  output: /src/assets

content:
  - name: profile
    label: ประวัติส่วนตัว
    type: file
    path: src/content/profile.json
    list: true
    fields:
      - { name: id, label: รหัสอ้างอิง, type: string, hidden: true }
      - { name: fullName, label: ชื่อ–สกุล, type: string, required: true }
      - { name: studentId, label: รหัสนักศึกษา, type: string, required: true }
      - { name: avatar, label: รูปประจำตัว, type: image, required: true }
      - { name: company, label: ชื่อสถานประกอบการ, type: string, required: true }
      - { name: department, label: แผนกที่ฝึกงาน, type: string, required: true }
      - { name: periodLabel, label: ช่วงเวลาฝึกงาน, type: string, required: true }
      - { name: intro, label: แนะนำตัว, type: text, required: true }
      - name: education
        label: ประวัติการศึกษา
        type: object
        list: true
        fields:
          - { name: year, label: ช่วงปี, type: string }
          - { name: detail, label: รายละเอียด, type: string }
      - name: skills
        label: ทักษะ
        type: object
        list: true
        fields:
          - { name: name, label: ชื่อทักษะ, type: string }
          - { name: level, label: ระดับ, type: string }
      - { name: talents, label: ความสามารถพิเศษ, type: string, list: true }
      - name: contacts
        label: ช่องทางติดต่อ
        type: object
        list: true
        fields:
          - { name: label, label: ประเภท, type: string }
          - { name: value, label: ข้อมูล, type: string }
          - { name: href, label: ลิงก์ (ถ้ามี), type: string, required: false }

  - name: weeks
    label: ผลงานรายสัปดาห์
    type: collection
    path: src/content/weeks
    filename: 'week-{fields.weekNumber}.md'
    view:
      fields: [weekNumber, title, dateStart]
      sort: [weekNumber]
    fields:
      - { name: weekNumber, label: สัปดาห์ที่, type: number, required: true }
      - { name: dateStart, label: วันเริ่ม, type: date, required: true }
      - { name: dateEnd, label: วันสิ้นสุด, type: date, required: true }
      - { name: title, label: หัวข้องาน, type: string, required: true }
      - { name: assignment, label: งานที่ได้รับมอบหมาย, type: text, required: true }
      - { name: steps, label: ขั้นตอนการทำงาน, type: string, list: true, required: true }
      - { name: learned, label: สิ่งที่ได้เรียนรู้, type: text, required: true }
      - { name: problem, label: ปัญหาที่พบ, type: text, required: true }
      - { name: solution, label: วิธีแก้ไข, type: text, required: true }
      - name: photos
        label: ภาพประกอบ (อย่างน้อย 1 ภาพ)
        type: object
        list: true
        fields:
          - { name: src, label: ภาพ, type: image, required: true }
          - { name: caption, label: คำบรรยายภาพ, type: string }

  - name: gallery
    label: แกลเลอรี
    type: file
    path: src/content/gallery.json
    list: true
    fields:
      - { name: id, label: รหัสอ้างอิง, type: string, required: true }
      - name: kind
        label: ประเภท
        type: select
        required: true
        options:
          values:
            - { value: photo, label: รูปภาพ }
            - { value: video-upload, label: วิดีโอ - อัปโหลดไฟล์ }
            - { value: video-youtube, label: วิดีโอ - ลิงก์ YouTube }
      - name: category
        label: หมวด
        type: select
        required: true
        options:
          values: [การทำงาน, การประชุม, กิจกรรมบริษัท, ผลงานที่ภาคภูมิใจ]
      - { name: caption, label: คำบรรยาย, type: string, required: true }
      - { name: src, label: 'รูปภาพ (เฉพาะประเภท รูปภาพ)', type: image, required: false }
      - { name: file, label: 'ไฟล์วิดีโอใน public/videos (เฉพาะ อัปโหลดไฟล์)', type: string, required: false }
      - { name: poster, label: 'ภาพปกวิดีโอ (ถ้ามี)', type: image, required: false }
      - { name: youtubeId, label: 'รหัสวิดีโอ YouTube (เฉพาะ ลิงก์ YouTube)', type: string, required: false }

  - name: summary
    label: สรุปผลการฝึกงาน
    type: file
    path: src/content/summary.json
    list: true
    fields:
      - { name: id, label: รหัสอ้างอิง, type: string, hidden: true }
      - { name: gained, label: สิ่งที่ได้รับจากการฝึกงาน, type: text, required: true }
      - { name: skillsDeveloped, label: ทักษะที่พัฒนาขึ้น, type: string, list: true, required: true }
      - { name: impression, label: ความประทับใจ, type: text, required: true }
      - { name: suggestion, label: ข้อเสนอแนะ, type: text, required: true }
