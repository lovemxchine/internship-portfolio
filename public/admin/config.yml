backend:
  name: github
  repo: lovemxchine/internship-portfolio
  branch: main

media_folder: src/assets/uploads
public_folder: /src/assets/uploads

locale: th

collections:
  - name: profile
    label: ประวัติส่วนตัว
    files:
      - name: profile
        label: ข้อมูลส่วนตัว
        file: src/content/profile.json
        fields:
          - { name: id, label: รหัสอ้างอิง, widget: hidden, default: profile }
          - { name: fullName, label: ชื่อ–สกุล, widget: string }
          - { name: studentId, label: รหัสนักศึกษา, widget: string }
          - { name: avatar, label: รูปประจำตัว, widget: image }
          - { name: company, label: ชื่อสถานประกอบการ, widget: string }
          - { name: department, label: แผนกที่ฝึกงาน, widget: string }
          - { name: periodLabel, label: ช่วงเวลาฝึกงาน, widget: string }
          - { name: intro, label: แนะนำตัว, widget: text }
          - name: education
            label: ประวัติการศึกษา
            widget: list
            fields:
              - { name: year, label: ช่วงปี, widget: string }
              - { name: detail, label: รายละเอียด, widget: string }
          - name: skills
            label: ทักษะ
            widget: list
            fields:
              - { name: name, label: ชื่อทักษะ, widget: string }
              - { name: level, label: ระดับ, widget: string }
          - { name: talents, label: ความสามารถพิเศษ, widget: list, field: { name: item, label: ข้อ, widget: string } }
          - name: contacts
            label: ช่องทางติดต่อ
            widget: list
            fields:
              - { name: label, label: ประเภท, widget: string }
              - { name: value, label: ข้อมูล, widget: string }
              - { name: href, label: ลิงก์ (ถ้ามี), widget: string, required: false }

  - name: weeks
    label: ผลงานรายสัปดาห์
    label_singular: สัปดาห์
    folder: src/content/weeks
    create: true
    slug: 'week-{{fields.weekNumber}}'
    extension: md
    format: yaml-frontmatter
    summary: 'สัปดาห์ที่ {{fields.weekNumber}} — {{fields.title}}'
    sortable_fields: [weekNumber, dateStart]
    fields:
      - { name: weekNumber, label: สัปดาห์ที่, widget: number, value_type: int, min: 1 }
      - { name: dateStart, label: วันเริ่ม, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { name: dateEnd, label: วันสิ้นสุด, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { name: title, label: หัวข้องาน, widget: string }
      - { name: assignment, label: งานที่ได้รับมอบหมาย, widget: text }
      - { name: steps, label: ขั้นตอนการทำงาน, widget: list, field: { name: step, label: ขั้นตอน, widget: string } }
      - { name: learned, label: สิ่งที่ได้เรียนรู้, widget: text }
      - { name: problem, label: ปัญหาที่พบ, widget: text }
      - { name: solution, label: วิธีแก้ไข, widget: text }
      - name: photos
        label: ภาพประกอบ
        widget: list
        min: 1
        fields:
          - { name: src, label: ภาพ, widget: image }
          - { name: caption, label: คำบรรยายภาพ, widget: string, required: false }
      - { name: body, label: '', widget: hidden, default: '' }

  - name: gallery
    label: แกลเลอรี
    files:
      - name: gallery
        label: รายการในแกลเลอรี
        file: src/content/gallery.json
        fields:
          - name: items
            label: รายการ
            widget: list
            fields:
              - { name: id, label: รหัสอ้างอิง, widget: string }
              - name: kind
                label: ประเภท
                widget: select
                options:
                  - { label: รูปภาพ, value: photo }
                  - { label: วิดีโอ — อัปโหลดไฟล์, value: video-upload }
                  - { label: วิดีโอ — ลิงก์ YouTube, value: video-youtube }
              - name: category
                label: หมวด
                widget: select
                options: [การทำงาน, การประชุม, กิจกรรมบริษัท, ผลงานที่ภาคภูมิใจ]
              - { name: caption, label: คำบรรยาย, widget: string }
              - { name: src, label: 'รูปภาพ — เฉพาะประเภท "รูปภาพ"', widget: image, required: false }
              - { name: file, label: 'ชื่อไฟล์วิดีโอใน public/videos — เฉพาะ "อัปโหลดไฟล์"', widget: string, required: false }
              - { name: poster, label: ภาพปกวิดีโอ (ถ้ามี), widget: image, required: false }
              - { name: youtubeId, label: 'รหัสวิดีโอ YouTube — เฉพาะ "ลิงก์ YouTube"', widget: string, required: false }

  - name: summary
    label: สรุปผลการฝึกงาน
    files:
      - name: summary
        label: สรุปผล
        file: src/content/summary.json
        fields:
          - { name: id, label: รหัสอ้างอิง, widget: hidden, default: summary }
          - { name: gained, label: สิ่งที่ได้รับจากการฝึกงาน, widget: text }
          - { name: skillsDeveloped, label: ทักษะที่พัฒนาขึ้น, widget: list, field: { name: item, label: ข้อ, widget: string } }
          - { name: impression, label: ความประทับใจ, widget: text }
          - { name: suggestion, label: ข้อเสนอแนะ, widget: text }
